<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chromacord social card</title>
<link rel="stylesheet" href="../assets/css/app.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #1b1b1b; }
  .card { position: relative; width: 1200px; height: 630px; padding: 64px 72px; display: grid; grid-template-columns: 420px 1fr; gap: 48px; align-items: center; }
  .mark { display: flex; flex-direction: column; gap: 22px; }
  .mark img { width: 76px; height: 76px; }
  .mark h1 { font: 820 66px/1 var(--ui); font-variation-settings: 'CASL' 1; letter-spacing: -0.02em; color: #ededed; }
  .mark p { font: 400 25px/1.35 var(--ui); color: #b8b8b8; }
  .mark .small { font-size: 19px; color: #8a8a8a; }
  .chat { padding: 22px 24px 26px 20px; border-radius: 18px; }
  .msg { grid-template-columns: 44px minmax(0, 1fr); }
  .avatar img { width: 44px; height: 44px; }
  .msg-name { font-size: 18px; }
  .msg-time { font-size: 13px; }
  .shot { font: 400 17px/23px var(--mono); color: var(--chat-text); white-space: pre; padding: 12px 14px; }
</style>
</head>
<body data-theme="ash">
  <div class="card">
    <div class="mark">
      <img src="../assets/img/icon.svg" alt="">
      <h1>Chromacord</h1>
      <p>Colored text for Discord, with gradients, effects and templates.</p>
      <p class="small">Free, open source, runs in your browser.</p>
    </div>
    <div class="chat">
      <div class="msg">
        <div class="avatar"><img src="../assets/img/icon.svg" alt=""></div>
        <div class="msg-main">
          <div class="msg-head"><span class="msg-name">You</span><span class="msg-time">Today at 18:00</span></div>
          <div class="code"><div class="shot" id="shot"></div></div>
        </div>
      </div>
    </div>
  </div>
  <script type="module">
    import { TEMPLATES } from '../assets/js/data/templates.js';
    import { renderRuns } from '../assets/js/ui/editor.js';
    const pick = new URLSearchParams(location.search).get('t') || 'announcement';
    renderRuns(document.getElementById('shot'), TEMPLATES.find((t) => t.id === pick).build());
    document.fonts.ready.then(() => document.body.setAttribute('data-ready', '1'));
  </script>
</body>
</html>
